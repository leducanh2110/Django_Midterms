{% extends "auth_base.html" %}

{% block title %}Sign in{% endblock %}

{% block auth_content %}
<div class="form-heading">
    <p class="eyebrow">YOUR ACCOUNT</p>
    <h2 id="form-title">Welcome back.</h2>
    <p>Enter your details to pick up where you left off.</p>
</div>
<form method="post" action="{% url 'accounts:login' %}" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "accounts/_form_fields.html" %}
    <button class="button button-primary" type="submit">Sign in <span aria-hidden="true">&rarr;</span></button>
</form>
<p class="form-switch">New around here? <a href="{% url 'accounts:register' %}">Create an account</a></p>
{% endblock %}
